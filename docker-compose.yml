services:
  scylladb:
    image: scylladb/scylla:latest
    container_name: scylladb-dev
    ports:
      - "9042:9042" # Native protocol (CQL)
      - "9160:9160" # Thrift protocol (legacy)
      - "7000:7000" # Internode communication
      - "7001:7001" # Internode communication SSL
      - "10000:10000" # REST API & Web UI
    volumes:
      - scylladb-data:/var/lib/scylla
    environment:
      SCYLLA_REPLACE_ADDRESS: 127.0.0.1
      SCYLLA_LISTEN_ADDRESS: 0.0.0.0
      SCYLLA_BROADCAST_ADDRESS: 127.0.0.1
    healthcheck:
      test:
        [
          "CMD",
          "cqlsh",
          "-u",
          "cassandra",
          "-p",
          "cassandra",
          "-e",
          "select cluster_name from system.local",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - scylladb-network

    image: dbeaver/cloudbeaver:latest
    container_name: dbeaver-web
    depends_on:
      scylladb:
        condition: service_healthy
    ports:
      - "8978:8978" # DBeaver Web UI
    environment:
      CB_SERVER_URL: "http://localhost:8978"
    volumes:
      - dbeaver-data:/opt/cloudbeaver/workspace
    networks:
      - scylladb-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8978/api/about" ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  scylladb-data:
    driver: local

networks:
  scylladb-network:
    driver: bridge
